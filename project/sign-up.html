<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Rosée Skin – Sign Up Page</title>
  </head>
  <body>
    <div class="announce">
      Free shipping on orders over 2,000 EGP &nbsp;|&nbsp; Use code
      <b>GLOW15</b> for 15% off
    </div>
    <div
      class="container d-flex justify-content-center align-items-center py-5"
    >
      <div class="row border rounded-5 p-3 bg-white shadow box-area">
        
        <div
          class="col-md-6 rounded-4 d-flex justify-content-center align-items-center flex-column left-box"
        >
          <div class="col-lg-6">
            <div class="mini-img">
              <img
                src="../photos/MEDICUBE SKINCARE.jpg"
                alt="Five mini products: cleansing foam, toner, serums and gel mask"
              />
            </div>
          </div>
        </div>
       
        <div class="col-md-6 right-box">
          <div class="row align-items-center">
            <div class="header-text mb-4">
              <h2>Create Account</h2>
              <p>Join us and start your glow journey.</p>
            </div>
            <form action="index.html" onsubmit="return signUp()">
              
              <div class="input-group mb-3">
                <input
                  type="text"
                  class="form-control form-control-lg bg-light fs-6"
                  placeholder="Full name"
                  required
                />
              </div>
            
              <div class="input-group mb-3">
                <input
                  type="email"
                  class="form-control form-control-lg bg-light fs-6"
                  placeholder="Email address"
                  required
                />
              </div>
              
              <div class="input-group mb-3">
                <input
                  type="password"
                  id="signPassword"
                  class="form-control form-control-lg bg-light fs-6"
                  placeholder="Password (at least 6 characters)"
                  minlength="6"
                  required
                />
              </div>
              <div class="input-group mb-1">
                <input
                  type="password"
                  id="signConfirm"
                  class="form-control form-control-lg bg-light fs-6"
                  placeholder="Confirm password"
                  required
                />
              </div>
              <div class="text-danger small mb-3" id="passError"></div>
              <div class="input-group mb-4">
                <div class="form-check">
                  <input
                    type="checkbox"
                    class="form-check-input"
                    id="formCheck"
                    required
                  />
                  <label
                    for="formCheck"
                    class="form-check-label text-secondary"
                  >
                    <small>I agree to the terms and conditions</small>
                  </label>
                </div>
              </div>
             
              <div class="input-group mb-3">
                <button type="submit" class="btn btn-lg btn-primary w-100 fs-6">
                  Sign Up
                </button>
              </div>
              
              <div class="input-group mb-3">
                <button
                  type="button"
                  class="btn btn-lg btn-light border w-100 fs-6"
                >
                  <img
                    src="../photos/png-transparent-g-suite-google-play-google-logo-google-text-logo-cloud-computing-thumbnail.png"
                    style="width: 20px"
                    class="me-2"
                  />
                  <small>Sign Up with Google</small>
                </button>
              </div>
            </form>
          </div>
         
          <div class="row">
            <div class="col text-secondary d-flex align-items-end">
              <small>
                Already have an account? <a href="login.html">Login</a>
              </small>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="./index.js"></script>
  </body>
</html>
